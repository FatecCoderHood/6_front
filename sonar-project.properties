sonar.sources=src
sonar.exclusions=src/**/*.json,src/assets/**
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Views, components and mocks are not unit-tested; the logic under src/api and src/service is.
sonar.coverage.exclusions=src/pages/**,src/components/**,src/api/mocks/**,src/service/*Mock*.ts,src/service/mockData.ts,src/**/*.vue,src/**/*.test.ts
